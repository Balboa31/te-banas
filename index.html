<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Una pregunta importante</title>
    <style>
      :root {
        font-family: "Trebuchet MS", system-ui, sans-serif;
        color: #422044;
        background: #ffd6e7;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        overflow: hidden;
        background:
          radial-gradient(circle at 12% 18%, #fff8 0 7px, transparent 8px),
          radial-gradient(circle at 84% 78%, #fff8 0 9px, transparent 10px),
          linear-gradient(135deg, #ffd6e7, #ffe9a8 52%, #c7f5e8);
        background-size: 86px 86px, 112px 112px, auto;
      }

      main {
        width: min(92vw, 620px);
        padding: clamp(2rem, 7vw, 4rem) 1.5rem;
        border: 4px solid #fff;
        border-radius: 34px;
        background: #fffaf0eF;
        box-shadow: 0 18px 0 #e99abc, 0 28px 55px #87476430;
        text-align: center;
      }

      .emoji {
        margin: 0 0 0.5rem;
        font-size: 3.5rem;
        animation: bob 2s ease-in-out infinite;
      }

      h1 {
        margin: 0;
        color: #a83f79;
        font-size: clamp(2.5rem, 10vw, 5rem);
        line-height: 1.05;
      }

      .prompt {
        margin: 1rem 0 2rem;
        font-size: clamp(1.1rem, 4vw, 1.4rem);
      }

      .buttons {
        min-height: 76px;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 1rem;
      }

      button {
        min-width: 112px;
        padding: 0.85rem 1.4rem;
        border: 0;
        border-radius: 999px;
        color: white;
        font: inherit;
        font-size: 1.2rem;
        font-weight: 800;
        cursor: pointer;
        box-shadow: 0 5px 0 #0002;
      }

      button:active {
        box-shadow: 0 2px 0 #0002;
        transform: translateY(3px);
      }

      #yes-button {
        background: #42b883;
      }

      #no-button {
        background: #f06b86;
      }

      #result {
        margin-top: 1.5rem;
      }

      #back-button {
        margin-top: 1rem;
        background: #a83f79;
        font-size: 1rem;
      }

      #result img {
        display: block;
        width: min(100%, 420px);
        max-height: 65vh;
        margin: 0 auto;
        border: 5px solid white;
        border-radius: 18px;
        object-fit: contain;
        box-shadow: 0 8px 24px #42204430;
      }

      [hidden] {
        display: none !important;
      }

      @keyframes bob {
        50% { transform: translateY(-8px) rotate(5deg); }
      }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <p class="emoji" aria-hidden="true">🫧🧼</p>
      <h1>¿Te bañas?</h1>
      <p class="prompt">Responde con sinceridad... 👀</p>
      <div class="buttons" id="buttons">
        <button id="yes-button" type="button">Sí</button>
        <button id="no-button" type="button">No</button>
      </div>
      <div id="result" aria-live="polite" hidden>
        <img src="no-te-banas.png" alt="Ya sé que no te bañas. Un Minion te lo recuerda.">
        <button id="back-button" type="button">Volver a la pregunta</button>
      </div>
    </main>
    <script>
      const yesButton = document.querySelector("#yes-button");
      const noButton = document.querySelector("#no-button");
      const buttons = document.querySelector("#buttons");
      const result = document.querySelector("#result");
      const backButton = document.querySelector("#back-button");
      let audioContext;
      let isMusicPlaying = false;

      function playSuspenseNote() {
        const notes = [130.81, 146.83, 164.81, 196, 174.61];
        const note = notes[Math.floor(Math.random() * notes.length)];
        const oscillator = audioContext.createOscillator();
        const volume = audioContext.createGain();
        const now = audioContext.currentTime;

        oscillator.type = "sine";
        oscillator.frequency.setValueAtTime(note, now);
        volume.gain.setValueAtTime(0.0001, now);
        volume.gain.exponentialRampToValueAtTime(0.045, now + 0.12);
        volume.gain.exponentialRampToValueAtTime(0.0001, now + 1.8);
        oscillator.connect(volume);
        volume.connect(audioContext.destination);
        oscillator.start(now);
        oscillator.stop(now + 1.85);
      }

      async function startMusic() {
        try {
          if (!audioContext) {
            audioContext = new AudioContext();

            const drone = audioContext.createGain();
            drone.gain.value = 0.035;
            drone.connect(audioContext.destination);

            [55, 82.41].forEach((frequency, index) => {
              const oscillator = audioContext.createOscillator();
              oscillator.type = index === 0 ? "sine" : "triangle";
              oscillator.frequency.value = frequency;
              oscillator.connect(drone);
              oscillator.start();
            });
          }

          if (audioContext.state !== "running") {
            await audioContext.resume();
          }

          if (audioContext.state !== "running" || isMusicPlaying) return;

          playSuspenseNote();
          setInterval(playSuspenseNote, 1800);
          isMusicPlaying = true;
        } catch (error) {
          console.error("No se pudo iniciar la música de suspenso.", error);
        }
      }

      function moveYesButton() {
        const margin = 12;
        const maxLeft = Math.max(margin, window.innerWidth - yesButton.offsetWidth - margin);
        const maxTop = Math.max(margin, window.innerHeight - yesButton.offsetHeight - margin);
        yesButton.style.position = "fixed";
        yesButton.style.left = `${margin + Math.random() * (maxLeft - margin)}px`;
        yesButton.style.top = `${margin + Math.random() * (maxTop - margin)}px`;
      }

      yesButton.addEventListener("pointerenter", moveYesButton);
      yesButton.addEventListener("pointerdown", (event) => {
        event.preventDefault();
        moveYesButton();
      });
      yesButton.addEventListener("focus", moveYesButton);
      yesButton.addEventListener("click", (event) => {
        event.preventDefault();
        moveYesButton();
      });

      noButton.addEventListener("click", () => {
        buttons.hidden = true;
        result.hidden = false;
      });

      backButton.addEventListener("click", () => {
        result.hidden = true;
        yesButton.style.position = "";
        yesButton.style.left = "";
        yesButton.style.top = "";
        buttons.hidden = false;
      });

      document.addEventListener("pointerdown", startMusic, { once: true });
      document.addEventListener("keydown", startMusic, { once: true });
      startMusic();
    </script>
  </body>
</html>
